name: Python Application CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. リポジトリのコードをチェックアウト
      uses: actions/checkout@v4

    - name: 2. Python 環境のセットアップ (Python 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 3. 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: 4. pytest で単体テストを実行
      # ↓ ここに env を追加して CI環境にダミーキーをセットします
      env:
        RAKUTEN_APPLICATION_ID: "dummy_app_id"
        RAKUTEN_ACCESS_KEY: "dummy_access_key"
      run: |
        pytest